name: Validate Remote Lock backend and dashboard
on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "dashboard/**"
      - "agent/**"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "server/**"
      - "dashboard/**"
      - "agent/**"
      - ".github/workflows/validate.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check backend and test syntax
        run: npm --prefix server run check
      - name: Check dashboard JavaScript syntax
        run: node --check dashboard/app.js
      - name: Check agent JavaScript syntax
        run: node --check agent/poller.mjs
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build Windows overlay agent
        run: dotnet build agent/windows-ui/RemoteLock.Agent.csproj --configuration Release
      - name: Publish portable Windows x64 agent bundle
        run: dotnet publish agent/windows-ui/RemoteLock.Agent.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/remote-lock-agent-win-x64
      - name: Upload Windows agent build
        uses: actions/upload-artifact@v4
        with:
          name: remote-lock-agent-win-x64
          path: artifacts/remote-lock-agent-win-x64/
          if-no-files-found: error
          retention-days: 14
      - name: Check package metadata
        run: node -e "const p=require('./server/package.json'); if (!p.private || p.type !== 'module') process.exit(1); console.log('package metadata OK')"
      - name: Run API integration tests
        run: npm --prefix server test
